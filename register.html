{% extends 'base.html' %}{% block content %}<div class="auth-wrap"><div class="auth-card"><h2>Create patient account</h2><p class="muted">Register to request and track hospital tokens.</p><form method="post"><label>Full name</label><input class="form-control mb-3" name="name" required><label>Email</label><input class="form-control mb-3" type="email" name="email" required><label>Password (minimum 6 characters)</label><input class="form-control mb-4" type="password" name="password" minlength="6" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
